<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --line: #d9e0ea;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --done: #16a34a;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: linear-gradient(135deg, #f8fbff 0%, var(--bg) 48%, #eef8f3 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(23, 32, 51, 0.12);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      transition: transform 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .add-btn {
      flex: 0 0 auto;
      background: var(--primary);
      color: white;
      padding: 0 20px;
      font-weight: 700;
    }

    .add-btn:hover {
      background: var(--primary-dark);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 28px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 6px;
      background: #eef2f7;
      padding: 4px;
      border-radius: 8px;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 6px;
    }

    .filter-btn.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(23, 32, 51, 0.12);
    }

    .clear-btn {
      background: transparent;
      color: var(--danger);
      padding: 8px 0;
    }

    .clear-btn:hover {
      color: #991b1b;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 8px 0;
      min-height: 180px;
    }

    .todo {
      display: grid;
      grid-template-columns: 32px 1fr 40px;
      align-items: center;
      gap: 10px;
      padding: 13px 28px;
    }

    .todo + .todo {
      border-top: 1px solid #eef2f7;
    }

    .todo input {
      width: 19px;
      height: 19px;
      accent-color: var(--done);
      cursor: pointer;
    }

    .todo span {
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .todo.done span {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    .delete-btn:hover {
      background: #fee2e2;
      color: var(--danger);
    }

    .empty {
      display: none;
      margin: 0;
      padding: 48px 28px;
      color: var(--muted);
      text-align: center;
    }

    .empty.visible {
      display: block;
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      header,
      .composer,
      .toolbar,
      .todo {
        padding-left: 18px;
        padding-right: 18px;
      }

      .composer,
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .add-btn {
        height: 46px;
      }

      .filters {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Todo List 应用">
    <header>
      <h1>Todo List</h1>
      <p class="subtitle">My todolist</p>
    </header>

    <form class="composer" id="todoForm">
      <input id="todoInput" type="text" placeholder="输入一个新任务..." autocomplete="off" aria-label="新任务">
      <button class="add-btn" type="submit">添加</button>
    </form>

    <section class="toolbar" aria-label="任务工具栏">
      <span id="counter">0 个待完成</span>
      <div class="filters" role="group" aria-label="筛选任务">
        <button class="filter-btn active" type="button" data-filter="all">全部</button>
        <button class="filter-btn" type="button" data-filter="active">未完成</button>
        <button class="filter-btn" type="button" data-filter="done">已完成</button>
      </div>
      <button class="clear-btn" id="clearDone" type="button">清空已完成</button>
    </section>

    <ul class="list" id="todoList"></ul>
    <p class="empty visible" id="emptyState">还没有任务，先添加一个吧。</p>
  </main>

  <script>
    const form = document.querySelector("#todoForm");
    const input = document.querySelector("#todoInput");
    const list = document.querySelector("#todoList");
    const counter = document.querySelector("#counter");
    const emptyState = document.querySelector("#emptyState");
    const clearDone = document.querySelector("#clearDone");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let todos = JSON.parse(localStorage.getItem("todos") || "[]");
    let currentFilter = "all";

    function saveTodos() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function visibleTodos() {
      if (currentFilter === "active") {
        return todos.filter((todo) => !todo.done);
      }
      if (currentFilter === "done") {
        return todos.filter((todo) => todo.done);
      }
      return todos;
    }

    function renderTodos() {
      const items = visibleTodos();
      list.innerHTML = "";

      items.forEach((todo) => {
        const item = document.createElement("li");
        item.className = `todo${todo.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label", `标记 ${todo.text}`);
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `删除 ${todo.text}`);
        deleteButton.addEventListener("click", () => {
          todos = todos.filter((itemTodo) => itemTodo.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        item.append(checkbox, text, deleteButton);
        list.append(item);
      });

      const activeCount = todos.filter((todo) => !todo.done).length;
      counter.textContent = `${activeCount} 个待完成`;
      emptyState.classList.toggle("visible", items.length === 0);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      todos.unshift({
        id: crypto.randomUUID(),
        text,
        done: false
      });
      input.value = "";
      saveTodos();
      renderTodos();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        renderTodos();
      });
    });

    clearDone.addEventListener("click", () => {
      todos = todos.filter((todo) => !todo.done);
      saveTodos();
      renderTodos();
    });

    renderTodos();
  </script>
</body>
</html>
